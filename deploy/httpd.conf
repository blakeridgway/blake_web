# /etc/httpd.conf — OpenBSD httpd
# Handles ACME challenges and redirects HTTP → HTTPS.
# relayd handles TLS termination and proxying to the Go app.

server "ridgway.dev" {
    listen on * port 80

    # Let's Encrypt ACME challenge
    location "/.well-known/acme-challenge/*" {
        root "/acme"
        request strip 2
    }

    # Redirect all HTTP to HTTPS
    location * {
        block return 301 "https://$HTTP_HOST$REQUEST_URI"
    }
}
