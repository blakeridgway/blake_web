# /etc/relayd.conf — TLS termination and proxy to Go app

log connection

table <personal-site> { 127.0.0.1 }

http protocol "https" {
    tls { certificate "/etc/ssl/ridgway.dev.fullchain.pem", key "/etc/ssl/private/ridgway.dev.key" }

    # Security headers
    match response header set "Strict-Transport-Security" value "max-age=31536000; includeSubDomains"
    match response header set "X-Frame-Options" value "DENY"
    match response header set "X-Content-Type-Options" value "nosniff"
    match response header set "Referrer-Policy" value "strict-origin-when-cross-origin"

    # Forward real client IP
    match request header set "X-Forwarded-For" value "$REMOTE_ADDR"
    match request header set "X-Forwarded-Proto" value "https"
    match request header set "X-Real-IP" value "$REMOTE_ADDR"

    pass
}

relay "www-tls" {
    listen on egress port 443
    protocol "https"
    forward to <personal-site> port 5002
}
