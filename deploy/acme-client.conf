# /etc/acme-client.conf — Let's Encrypt via OpenBSD acme-client

authority letsencrypt {
    api url "https://acme-v02.api.letsencrypt.org/directory"
    account key "/etc/acme/letsencrypt-privkey.pem"
}

domain ridgway.dev {
    alternative names { www.ridgway.dev }
    domain key "/etc/ssl/private/ridgway.dev.key"
    domain fullchain certificate "/etc/ssl/ridgway.dev.fullchain.pem"
    sign with letsencrypt
}
