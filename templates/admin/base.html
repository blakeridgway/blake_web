{{define "admin_base"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "admin_title" .}}Admin{{end}} — ridgway.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/css/site.css">
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <style>
    .admin-sidebar {
      background: var(--bg-card);
      border-right: 1px solid var(--border-color);
      min-height: 100vh;
      width: 220px;
      flex-shrink: 0;
    }
    .admin-content { flex: 1; overflow: auto; }
    .admin-nav-link {
      display: block;
      padding: 0.5rem 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      border-left: 2px solid transparent;
    }
    .admin-nav-link:hover, .admin-nav-link.active {
      color: var(--primary);
      border-left-color: var(--primary);
      background: rgba(0, 229, 195, 0.05);
    }
  </style>
</head>
<body style="background: var(--bg-dark);">
<div class="d-flex">

  <!-- Sidebar -->
  <div class="admin-sidebar py-4">
    <div class="px-4 mb-4">
      <a href="/" style="font-family: var(--font-mono); color: var(--primary); font-weight: 700; text-decoration: none; font-size: 1rem;">~/blake</a>
      <div style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono);">admin panel</div>
    </div>
    <nav>
      <a href="/admin" class="admin-nav-link{{if eq .Section "dashboard"}} active{{end}}">// dashboard</a>
      <a href="/admin/blog/new" class="admin-nav-link">// new post</a>
      <a href="/admin/traffic" class="admin-nav-link{{if eq .Section "traffic"}} active{{end}}">// traffic</a>
    </nav>
    <div class="px-4 mt-4" style="border-top: 1px solid var(--border-color); padding-top: 1rem !important;">
      <a href="/admin/logout" style="font-family: var(--font-mono); font-size: 0.8rem; color: #ff5f57; text-decoration: none;">logout</a>
    </div>
  </div>

  <!-- Main -->
  <div class="admin-content p-4">
    {{block "admin_content" .}}{{end}}
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{{block "admin_scripts" .}}{{end}}
</body>
</html>{{end}}
