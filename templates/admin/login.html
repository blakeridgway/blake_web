{{define "admin_base"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ridgway.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/site.css">
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
</head>
<body style="background: var(--bg-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center;">

<div style="width: 100%; max-width: 400px; padding: 1rem;">
  <div class="terminal-window">
    <div class="terminal-header">
      <span class="terminal-dot red"></span>
      <span class="terminal-dot yellow"></span>
      <span class="terminal-dot green"></span>
      <span class="ms-2" style="font-size: 0.8rem; opacity: 0.5;">blake@ridgway:~/admin</span>
    </div>
    <div class="terminal-body">
      <div class="term-prompt">sudo login</div>
      {{if .Error}}
      <div class="term-output mb-3" style="color: #ff5f57;">
        error: invalid credentials
      </div>
      {{end}}

      <form method="POST" action="/admin/login" class="mt-3">
        <div class="mb-3">
          <label style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted);">username</label>
          <input type="text" name="username" autocomplete="username" required
            class="form-control mt-1"
            style="background: var(--bg-elevated); border-color: var(--border-color); color: var(--text-primary); font-family: var(--font-mono);"
            placeholder="username">
        </div>
        <div class="mb-4">
          <label style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted);">password</label>
          <input type="password" name="password" autocomplete="current-password" required
            class="form-control mt-1"
            style="background: var(--bg-elevated); border-color: var(--border-color); color: var(--text-primary); font-family: var(--font-mono);"
            placeholder="password">
        </div>
        <button type="submit" class="btn btn-primary w-100">authenticate</button>
      </form>

      <div class="mt-3">
        <a href="/" style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); text-decoration: none;">← back to site</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>{{end}}
